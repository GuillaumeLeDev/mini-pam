<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mini-PAM — {% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .stat-card { border-left: 5px solid; border-radius: 6px; }
    .nav-link.active { font-weight: 600; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">&#128272; mini-PAM</a>
    <div class="navbar-nav ms-auto align-items-center">
      <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
      <a class="nav-link {% if request.path == '/checkout' %}active{% endif %}" href="/checkout">Checkout</a>
      <a class="nav-link {% if '/sessions' in request.path %}active{% endif %}" href="/sessions">Audit</a>
      <span class="badge bg-warning text-dark ms-3">{{ user }}</span>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
