<!DOCTYPE html>
<!-- 📌 À REVOIR : DOCTYPE déclare au navigateur que c'est du HTML5 (standard actuel) -->
<html lang="fr">
<head>
  <!-- charset=UTF-8 : permet les accents français sans bug d'affichage -->
  <meta charset="UTF-8">
  <!-- viewport : rend la page responsive (s'adapte aux mobiles) -->
  <!-- 📌 À REVOIR : sans cette ligne, Bootstrap n'est pas responsive sur mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Héritage Jinja2 : block title = emplacement que chaque page enfant écrase -->
  <title>mini-PAM — {% block title %}{% endblock %}</title>

  <!-- Bootstrap 5 CSS chargé depuis un CDN (pas besoin de l'installer localement) -->
  <!-- 📌 À REVOIR : CDN = Content Delivery Network, fichier hébergé par jsdelivr.net -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* CSS maison qui complète Bootstrap */
    body { background-color: #f0f2f5; } /* fond gris très clair */
    .navbar-brand { font-weight: 700; letter-spacing: 1px; } /* logo en gras avec espacement */
    /* 📌 À REVOIR : border-left crée la barre colorée sur le bord gauche des stat-cards */
    .stat-card { border-left: 5px solid; border-radius: 6px; }
    .nav-link.active { font-weight: 600; } /* lien de navigation actif en semi-gras */
  </style>
</head>
<body>

<!-- ── Barre de navigation ─────────────────────────────────────────────────── -->
<!-- navbar-dark bg-dark : fond sombre avec texte clair -->
<!-- 📌 À REVOIR : navbar-expand-lg = le menu reste horizontal au-dessus de 992px -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container"> <!-- container = largeur max centrée avec marges latérales -->

    <!-- Logo cliquable qui revient à l'accueil -->
    <a class="navbar-brand" href="/">&#128272; mini-PAM</a>
    <!-- &#128272; = emoji 🔐 en code HTML (unicode) -->

    <!-- ms-auto = margin-start auto → pousse les liens vers la droite -->
    <!-- 📌 À REVOIR : ms-auto est une classe utilitaire Bootstrap pour l'espacement -->
    <div class="navbar-nav ms-auto align-items-center">

      <!-- request.path = l'URL courante injectée par Flask (ex: "/", "/checkout") -->
      <!-- 📌 À REVOIR : Jinja2 compare request.path pour ajouter "active" au bon lien -->
      <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
      <a class="nav-link {% if request.path == '/checkout' %}active{% endif %}" href="/checkout">Checkout</a>
      <a class="nav-link {% if '/sessions' in request.path %}active{% endif %}" href="/sessions">Audit</a>

      <!-- badge = étiquette colorée Bootstrap. Affiche le nom de l'utilisateur connecté -->
      <!-- {{ user }} = variable Python passée par Flask via render_template(..., user=PORTAL_USER) -->
      <!-- 📌 À REVOIR : bg-warning text-dark = fond jaune avec texte noir (lisibilité) -->
      <span class="badge bg-warning text-dark ms-3">{{ user }}</span>
    </div>
  </div>
</nav>

<!-- ── Corps de la page ───────────────────────────────────────────────────── -->
<!-- container = zone de contenu centrée et limitée en largeur -->
<!-- pb-5 = padding-bottom 5 (espace en bas de page) -->
<div class="container pb-5">
  <!-- Héritage Jinja2 : block content = zone principale remplacée par chaque page enfant -->
  {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS (nécessaire pour les alertes dismissibles, modals, etc.) -->
<!-- 📌 À REVOIR : bundle.min.js inclut aussi Popper.js (tooltips, dropdowns) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
